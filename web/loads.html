<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plutus Bot — Loads</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/plutus_logo.jpg">
</head>
<body>

<header id="app-nav" class="topbar"></header>

<main class="content">
  <div class="page-toolbar">
    <h1>Loads</h1>
    <span class="hint">Recently matched loads · auto-refreshing · act on one with Bid PC / Phone / Draft</span>
  </div>

  <section class="panel">
    <div id="loads-list" class="feed-list">
      <p class="empty-note">No matched loads yet.</p>
    </div>
  </section>
</main>

<!-- Bid text modal — shown after a Bid PC/Phone/Draft click. Nothing is
     ever auto-sent (same principle as the rest of this project): this
     gives the dispatcher the actual text to copy/paste and send
     themselves, same as the desktop's clipboard-copy behavior. -->
<div id="bid-modal-overlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="bid-modal-title">Bid text</h2>
      <button id="bid-modal-close" class="icon-btn" type="button" title="Close">✕</button>
    </div>
    <p class="note-text" id="bid-modal-hint" style="padding-top:0;"></p>
    <textarea id="bid-modal-text" readonly rows="14"></textarea>
    <div class="form-actions" style="padding-top:14px;">
      <button id="bid-modal-copy" class="btn btn-primary" type="button">📋 Copy to clipboard</button>
      <button id="bid-modal-close-btn" class="btn" type="button">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="common.js"></script>
<script>
const MB = window.MailBot;
MB.requireAuth();
MB.initTheme();
MB.renderTopbar("loads.html");

function showToast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2500);
}

// ── Bid text modal ───────────────────────────────────────────────
// Nothing is ever sent automatically — same principle as the rest of
// this project. This just gives the dispatcher the actual text to
// copy/paste and send themselves (the desktop's equivalent copies to
// the clipboard and opens the Gmail thread for the same reason).
const modalOverlay = document.getElementById("bid-modal-overlay");
const modalTitle = document.getElementById("bid-modal-title");
const modalHint = document.getElementById("bid-modal-hint");
const modalText = document.getElementById("bid-modal-text");

const METHOD_HINT = {
  pc: "Copied to your clipboard — paste it (Ctrl/Cmd+V) into your reply on Sylectus or in Gmail and send it yourself. Nothing is sent automatically.",
  phone: "Copied to your clipboard — use this as your talking points for the call, then log what the broker agreed to.",
  draft: "Copied to your clipboard — paste it into a new email or reply and send when ready. (A real Gmail draft isn't created automatically from the web yet — paste-and-send is the current path.)",
};

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    return false; // clipboard permission denied/unavailable — modal still shows the text to copy manually
  }
}

function openBidModal(orderId, method, bidText, copied) {
  modalTitle.textContent = `Bid text — #${orderId} (${method.toUpperCase()})`;
  modalHint.textContent = (copied ? "" : "⚠️ Couldn't auto-copy (clipboard permission) — select the text below manually. ")
    + METHOD_HINT[method];
  modalText.value = bidText;
  modalOverlay.hidden = false;
  modalText.focus();
  modalText.select();
}
function closeBidModal() { modalOverlay.hidden = true; }
document.getElementById("bid-modal-close").addEventListener("click", closeBidModal);
document.getElementById("bid-modal-close-btn").addEventListener("click", closeBidModal);
document.getElementById("bid-modal-copy").addEventListener("click", async () => {
  const ok = await copyToClipboard(modalText.value);
  showToast(ok ? "Copied to clipboard" : "Couldn't access clipboard — select the text manually", !ok);
});
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeBidModal(); });

async function recordBid(orderId, method, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const result = await MB.apiPost("/api/web/record_bid", { order_id: orderId, method });
    const copied = await copyToClipboard(result.bid_text || "");
    openBidModal(orderId, method, result.bid_text || "", copied);
    showToast(`Recorded ${method.toUpperCase()} bid for #${orderId} (bid #${result.bid_id})`);
    // Mark this load's card as "recorded" so a re-click isn't ambiguous.
    btn.closest(".feed-card").querySelectorAll("button").forEach((b) => {
      b.disabled = true;
    });
    btn.textContent = "✓ Recorded";
  } catch (err) {
    showToast(err.message || "Failed to record bid", true);
    btn.disabled = false;
    btn.textContent = original;
  }
}

function renderLoads(items) {
  const el = document.getElementById("loads-list");
  if (!items || items.length === 0) {
    el.innerHTML = '<p class="empty-note">No matched loads yet.</p>';
    return;
  }
  el.innerHTML = items.map((it) => {
    const decision = it.load_decision?.decision;
    const decisionBadge = decision
      ? `<span class="badge decision-${decision.toLowerCase()}">${MB.esc(decision)}
           ${it.load_decision.confidence != null ? `(${Math.round(it.load_decision.confidence * 100)}%)` : ""}</span>`
      : "";
    const miles = it.google_deadhead != null ? `${it.google_deadhead}mi deadhead` : "";
    const eta = it.deadhead_eta_minutes != null ? `${Math.round(it.deadhead_eta_minutes / 60)}h ETA` : "";
    const suggested = it.bid_recommendation?.suggested_amount
      ? `Suggested ${MB.fmtMoney(it.bid_recommendation.suggested_amount)} (${it.bid_recommendation.basis})`
      : "";
    const broker = it.broker_name || it.broker_email
      ? `Broker: ${MB.esc(it.broker_name || it.broker_email)}`
      : "";
    const meta = [it.driver_name, miles, eta, suggested, broker].filter(Boolean).map(MB.esc).join(" · ");
    const reasons = (it.load_decision?.reasons || []).slice(0, 3)
      .map((r) => `<div class="meta">• ${MB.esc(r)}</div>`).join("");
    const orderId = MB.esc(it.order || "");

    return `
      <div class="feed-card">
        <div class="order">#${orderId} <span style="color:var(--text-dim);font-weight:400;">${MB.esc(it.vehicle_required || "")}</span></div>
        ${decisionBadge}
        <div class="route">${MB.esc(it.pickup_loc || "?")} → ${MB.esc(it.delivery_loc || "?")}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
        ${reasons}
        <div class="action-row" style="grid-column:1/-1;margin-top:8px;">
          <button class="btn btn-primary btn-sm" data-order="${orderId}" data-method="pc">Bid PC</button>
          <button class="btn btn-sm" data-order="${orderId}" data-method="phone">Bid Phone</button>
          <button class="btn btn-sm" data-order="${orderId}" data-method="draft">Draft</button>
        </div>
      </div>`;
  }).join("");

  el.querySelectorAll("button[data-order]").forEach((btn) => {
    btn.addEventListener("click", () =>
      recordBid(btn.dataset.order, btn.dataset.method, btn));
  });
}

async function refresh() {
  try {
    const feed = await MB.apiGet("/api/web/feed", { limit: 50 });
    renderLoads(feed.items);
    MB.setConn(true);
  } catch (err) {
    MB.setConn(false);
    MB.bounceIfAuthError(err);
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
