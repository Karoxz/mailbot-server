<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plutus Bot — Activity</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/plutus_logo.jpg">
</head>
<body>

<header id="app-nav" class="topbar"></header>

<main class="content">
  <div class="page-toolbar">
    <h1>Activity</h1>
    <span class="hint">The web bot's live log — the equivalent of the desktop's log panel · auto-refreshing</span>
  </div>

  <section class="panel">
    <div id="activity-controls"></div>
    <div class="list-controls" style="border-top:0;padding-top:0;">
      <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text-dim);cursor:pointer;">
        <input type="checkbox" id="show-skipped"> Show skipped loads (non-matching emails — high volume)
      </label>
    </div>
    <div id="activity-list" class="feed-list"></div>
  </section>
</main>

<script src="common.js"></script>
<script>
const MB = window.MailBot;
MB.requireAuth();
MB.initTheme();
MB.renderTopbar("activity.html");

const EVENT_ICON = {
  bid_recorded:          "💰",
  bid_won:               "🏆",
  bid_outcome:           "📊",
  broker_blacklisted:    "🚫",
  broker_unblacklisted:  "✅",
  backfill_run:          "🔄",
  thread_learning:       "🧠",
  gmail_connected:       "📧",
  gmail_disconnected:    "📪",
  standalone_enabled:    "▶️",
  standalone_disabled:   "⏸️",
  standalone_scan:       "🔎",
  web_paused:            "⏸️",
  web_resumed:           "▶️",
  load_matched:          "📦",
  load_skipped:          "⏭️",
  labeled_ping:          "📌",
  send_failed:           "❌",
  poller_error:          "⚠️",
};

let allEvents = [];
const controls = MB.mountListControls(document.getElementById("activity-controls"), {
  searchPlaceholder: "Search the log (order #, broker, event…)",
  onChange: applyFilters,
});
document.getElementById("show-skipped").addEventListener("change", applyFilters);

function applyFilters() {
  const showSkipped = document.getElementById("show-skipped").checked;
  const base = showSkipped ? allEvents : allEvents.filter((e) => e.event_type !== "load_skipped");
  const result = MB.filterSortPaginate(base, {
    searchTerm: controls.searchTerm,
    searchFields: ["message", "event_type"],
  });
  renderActivity(result.items);
}

function renderActivity(items) {
  const el = document.getElementById("activity-list");
  MB.diffRender(el, items, {
    key: (it) => it.id,
    isRow: false,
    emptyHtml: '<p class="empty-note">No activity yet.</p>',
    html: (it) => `
      <div class="feed-card">
        <div class="order">${EVENT_ICON[it.event_type] || "•"} ${MB.esc(it.message)}</div>
        <div class="meta">${MB.fmtWhen(it.created_at)}</div>
      </div>`,
  });
}

async function refresh() {
  try {
    const res = await MB.apiGet("/api/web/activity", { limit: 500 });
    allEvents = res.items;
    applyFilters();
    MB.setConn(true);
  } catch (err) {
    MB.setConn(false);
    MB.bounceIfAuthError(err);
  }
}

document.getElementById("activity-list").innerHTML = MB.skeletonCards(4);

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
