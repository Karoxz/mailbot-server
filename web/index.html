<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLUTUS BOT</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/plutus_logo_icon.png">
<style>
  /* Wider than the shared .content default (1100px) so the feed grid
     below actually has room to lay out 3-4 cards per row — client,
     2026-10-01: "make loads in the 3 or 4 rows, see which one fits
     better". auto-fill in style.css's .feed-list rule does the actual
     "3 or 4, whichever fits" adapting on its own once there's enough
     width to work with. */
  @media (min-width: 900px) {
    main.content { max-width: 1700px; }
  }
</style>
</head>
<body>

<header id="app-nav" class="topbar"></header>

<main class="content">
  <!-- Standalone mode moved to the Trucks page, 2026-10-01 (client:
       "move standalone mode block from dashboard page to the top of
       trucks page"). See trucks.html. -->
  <section class="panel">
    <div class="panel-header">
      <h2>Live feed</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="panel-hint">Incoming loads · act on one directly — Bid / Draft</span>
        <button id="notify-toggle-btn" class="btn btn-sm" type="button" title="Get a popup + sound when a new load comes in">🔔 Enable alerts</button>
        <button id="refresh-btn" class="btn btn-sm" type="button" title="Refresh now">⟳ Refresh</button>
        <button id="clear-feed-btn" class="btn btn-sm" type="button" title="Clear the feed — hides current loads; a genuinely new load still shows up">🗑 Clear</button>
      </div>
    </div>
    <div id="loads-controls"></div>
    <div id="loads-list" class="feed-list"></div>
  </section>
</main>

<!-- Bid text modal — shown after a Draft click. Nothing is
     ever auto-sent (same principle as the rest of this project): this
     gives the dispatcher the actual text to copy/paste and send
     themselves, same as the desktop's clipboard-copy behavior. Bid PC
     goes to bid_price.html instead (its own price+map page). -->
<div id="bid-modal-overlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="bid-modal-title">Bid text</h2>
      <button id="bid-modal-close" class="icon-btn" type="button" title="Close">✕</button>
    </div>
    <p class="note-text" id="bid-modal-hint" style="padding-top:0;"></p>
    <textarea id="bid-modal-text" readonly rows="14"></textarea>
    <div class="form-actions" style="padding-top:14px;">
      <button id="bid-modal-copy" class="btn btn-primary" type="button">📋 Copy to clipboard</button>
      <a id="bid-modal-gmail" class="btn" target="_blank" rel="noopener">✉️ Find thread in Gmail</a>
      <button id="bid-modal-close-btn" class="btn" type="button">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="common.js"></script>
<script>
const MB = window.MailBot;
MB.requireAuth();
MB.initTheme();
MB.renderTopbar("index.html");

function showToast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2500);
}

// ── Bid text modal (Phone/Draft) ────────────────────────────────────
const modalOverlay = document.getElementById("bid-modal-overlay");
const modalTitle = document.getElementById("bid-modal-title");
const modalHint = document.getElementById("bid-modal-hint");
const modalText = document.getElementById("bid-modal-text");
const modalGmailLink = document.getElementById("bid-modal-gmail");

const METHOD_HINT = {
  phone: "Copied to your clipboard — use this as your talking points for the call, then log what the broker agreed to.",
  draft: "Copied to your clipboard — paste it into a new email or reply and send when ready. (A real Gmail draft isn't created automatically from the web yet — paste-and-send is the current path.)",
};

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    return false; // clipboard permission denied/unavailable — modal still shows the text to copy manually
  }
}

function openBidModal(orderId, method, bidText, copied, brokerEmail, threadId) {
  modalTitle.textContent = `Bid text — #${orderId} (${method.toUpperCase()})`;
  modalHint.textContent = (copied ? "" : "⚠️ Couldn't auto-copy (clipboard permission) — select the text below manually. ")
    + METHOD_HINT[method];
  modalText.value = bidText;
  modalGmailLink.href = MB.gmailSearchUrl(orderId, brokerEmail, threadId);
  modalOverlay.classList.add("open");
  modalText.focus();
  modalText.select();
}
function closeBidModal() { modalOverlay.classList.remove("open"); }
document.getElementById("bid-modal-close").addEventListener("click", closeBidModal);
document.getElementById("bid-modal-close-btn").addEventListener("click", closeBidModal);
document.getElementById("bid-modal-copy").addEventListener("click", async () => {
  const ok = await copyToClipboard(modalText.value);
  showToast(ok ? "Copied to clipboard" : "Couldn't access clipboard — select the text manually", !ok);
});
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeBidModal(); });

async function recordBid(orderId, method, btn, brokerEmail) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const result = await MB.apiPost("/api/web/record_bid", { order_id: orderId, method });
    const copied = await copyToClipboard(result.bid_text || "");
    openBidModal(orderId, method, result.bid_text || "", copied, brokerEmail, result.thread_id);
    // New tab, current dashboard tab stays put — same pattern requested
    // for the BID PC flow below (2026-09-29: "not the plutus bot tab").
    window.open(MB.gmailSearchUrl(orderId, brokerEmail, result.thread_id), "_blank", "noopener");
    showToast(`Recorded ${method.toUpperCase()} bid for #${orderId} (bid #${result.bid_id})`);
    btn.closest(".feed-card").querySelectorAll("button").forEach((b) => { b.disabled = true; });
    btn.textContent = "✓ Recorded";
  } catch (err) {
    showToast(err.message || "Failed to record bid", true);
    btn.disabled = false;
    btn.textContent = original;
  }
}

// ── Live feed — full Telegram-notification parity, 2026-09-29 ──────
// Client: "incoming loads should have the same info as the telegram
// notification". parser_core.py now stores every field that message
// text shows (see the `lines` build in process_bid_email); this just
// lays them back out as a card instead of a wall of text.
function fmtDate(label, dt, asap, direct) {
  if (asap) return `${label}: ASAP${dt ? ` / ${dt}` : ""}`;
  if (direct) return `${label}: DIRECT`;
  return `${label}: ${dt || "UNKNOWN"}`;
}

// Broker reply cards — client, 2026-10-06: these used to only ever
// reach Telegram + the Bid History page, never the Live Feed.
// Redesigned 2026-10-07: "no need to use grok ... needs to just have
// the states and the brokers message inside, no 'won', 'countered', or
// 'lost' ... no needless processing, just states and brokers message"
// — same label+state signal poller.py's Telegram ping already sends
// (_notify_labeled_thread), zero LLM classification involved. No
// order_id exists for these (a Gmail thread/label, not a parsed load).
function renderReplyCard(it) {
  const gmailUrl = MB.gmailSearchUrl(null, "", it.thread_id);
  const clock = MB.fmtClock(it.received_at) || MB.fmtAgo(it.received_at);
  const states = (it.states || []).join(" · ") || "—";
  return `
    <div class="feed-card">
      <div class="order">💬 ${MB.esc((it.labels || []).join(", ") || "Reply")}</div>
      <div class="ago">${MB.esc(clock)}</div>
      <div class="meta">📍 States: ${MB.esc(states)}</div>
      ${it.subject ? `<div class="meta">${MB.esc(it.subject)}</div>` : ""}
      ${it.message ? `<div class="notes">${MB.esc(it.message)}</div>` : ""}
      <div class="action-row" style="grid-column:1/-1;margin-top:8px;">
        <a class="btn btn-sm" href="${gmailUrl}" target="_blank" rel="noopener">✉️ Find in Gmail</a>
      </div>
    </div>`;
}

function renderLoads(items) {
  const el = document.getElementById("loads-list");
  MB.diffRender(el, items, {
    // order+received_at, not just order — client-reported real bug,
    // 2026-10-06: two different brokers posting under the same order_id
    // is a genuine collision (not a re-poll of the same email), and the
    // backend now correctly keeps both as separate rows (load_store.py).
    // Keying only by order here would still visually collapse them back
    // into one card via diffRender's keyed reconciliation.
    key: (it) => it.type === "reply" ? `reply|${it.id}` : `load|${it.order}|${it.received_at || ""}`,
    isRow: false,
    emptyHtml: '<p class="empty-note">No matched loads yet.</p>',
    html: (it) => {
      if (it.type === "reply") return renderReplyCard(it);
      const orderId = MB.esc(it.order || "");
      const brokerEmail = it.broker_email || "";
      const gmailUrl = MB.gmailSearchUrl(it.order, brokerEmail, it.thread_id);
      // Absolute wall-clock time in the corner, not "X ago" — client,
      // 2026-10-01: "put time like this 07:36:24 EDT". Falls back to the
      // old relative format on the rare load with no received_at.
      const clock = MB.fmtClock(it.received_at) || MB.fmtAgo(it.received_at);
      // Driver's name now rides on the header line itself (client:
      // "put the drivers name right next to this text") instead of only
      // appearing further down — real client-reported bug, 2026-10-01:
      // "load didnt include drivers name" was traced to a real server
      // bug (an empty truck list used to still save a truck-less load);
      // fixed server-side, but a load genuinely matched to no truck
      // (shouldn't happen now) still shows nothing here rather than a
      // misleading blank.
      const driverTag = it.driver_name ? ` · <span class="driver">${MB.esc(it.driver_name)}</span>` : "";

      const pickupLine = MB.esc(fmtDate("Pick-up", it.pickup_dt, it.pickup_asap, it.pickup_direct));
      const deliverLine = MB.esc(fmtDate("Deliver", it.delivery_dt, it.delivery_asap, it.deliver_direct));

      // "mi" -> "miles", and the whole "N miles out" phrase bolded as one
      // unit rather than splitting bold/plain right at the word boundary
      // (client, 2026-10-01: "instead of mi it should be miles" — also
      // sidesteps a copy/paste artifact where text split across a tag
      // boundary like that came out run-together, "18miout").
      const milesBits = [
        it.google_deadhead != null ? `<strong>${MB.esc(it.google_deadhead)} miles out</strong>` : "",
        it.loaded_miles != null ? `<strong>${MB.esc(it.loaded_miles)} miles loaded</strong>` : "",
        it.total_miles != null ? `<strong>${MB.esc(it.total_miles)} miles total</strong>` : "",
      ].filter(Boolean);
      // Hours+minutes (rounded to 5min), not just whole hours — client,
      // 2026-10-01: "when the ETA is less then 1 hour, it just says ETA
      // 0h, add minutes aswell, but minutes should be rounded to 5".
      const etaBits = [
        it.transit_minutes ? `TT ${MB.fmtDuration5(it.transit_minutes)}` : "",
        it.deadhead_eta_minutes != null ? `ETA ${MB.fmtDuration5(it.deadhead_eta_minutes)}` : "",
      ].filter(Boolean);
      const freightBits = [
        it.stops ? `${MB.esc(it.stops)} stops` : "",
        it.pieces ? `${MB.esc(it.pieces)} pcs` : "",
        it.weight ? `${MB.esc(it.weight)}` : "",
        it.freight_dims ? `${MB.esc(it.freight_dims)}` : "",
        it.stackable ? `stackable: ${MB.esc(it.stackable)}` : "",
      ].filter(Boolean);
      const truckBits = [
        it.truck_dimensions ? MB.esc(it.truck_dimensions) : "",
      ].filter(Boolean);
      // Each piece is escaped BEFORE being wrapped in <strong> — mapping
      // MB.esc over the joined array afterward (the earlier bug here)
      // re-escapes the tag itself, so it prints literally instead of
      // rendering bold. Build the already-safe HTML fragments directly.
      const brokerBits = [
        it.broker_name ? `<strong>${MB.esc(it.broker_name)}</strong>` : "",
        it.broker_company ? MB.esc(it.broker_company) : "",
        it.broker_phone ? MB.esc(it.broker_phone) : "",
        brokerEmail ? MB.esc(brokerEmail) : "",
      ].filter(Boolean);

      const metaRow = (bits) => bits.length ? `<div class="meta">${bits.join(" · ")}</div>` : "";

      return `
        <div class="feed-card">
          <div class="order">#${orderId} <span style="font-weight:600;">${MB.esc(it.vehicle_required || "")}</span>${driverTag}</div>
          <div class="ago">${MB.esc(clock)}</div>
          <div class="route">${MB.esc(it.pickup_loc || "?")} → ${MB.esc(it.delivery_loc || "?")}</div>
          <div class="meta">${pickupLine} &nbsp;·&nbsp; ${deliverLine}</div>
          ${metaRow(milesBits)}
          ${metaRow(truckBits)}
          ${metaRow(etaBits)}
          ${metaRow(freightBits)}
          ${brokerBits.length ? `<div class="meta">${brokerBits.join(" · ")}</div>` : ""}
          ${it.notes ? `<div class="notes">🔔 ${MB.esc(it.notes)}</div>` : ""}
          <div class="action-row" style="grid-column:1/-1;margin-top:8px;">
            <button class="btn btn-primary btn-sm" data-order="${orderId}" data-method="pc" data-broker="${MB.esc(brokerEmail)}">💵 Bid</button>
            <button class="btn btn-sm" data-order="${orderId}" data-method="draft" data-broker="${MB.esc(brokerEmail)}">Draft</button>
            <a class="btn btn-sm" href="${gmailUrl}" target="_blank" rel="noopener">✉️ Find in Gmail</a>
          </div>
        </div>`;
    },
  });
}

document.getElementById("loads-list").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-order]");
  if (!btn || btn.disabled) return;
  if (btn.dataset.method === "pc") {
    window.location.href = `bid_price.html?order_id=${encodeURIComponent(btn.dataset.order)}`;
    return;
  }
  recordBid(btn.dataset.order, btn.dataset.method, btn, btn.dataset.broker);
});

let allLoads = [];

// "Clear" just hides what's currently in the feed — nothing is deleted
// server-side (bid_history/load_store are untouched). Persisted per
// license in localStorage (a per-viewer convenience, same pattern as
// NOTIFY_KEY above) so it survives a refresh/reload; a load that's
// genuinely new (different order+received_at) still shows up normally.
const CLEARED_KEY = `mailbot_feed_cleared_${MB.getLicenseKey() || ""}`;
let clearedKeys = new Set();
try { clearedKeys = new Set(JSON.parse(localStorage.getItem(CLEARED_KEY) || "[]")); } catch (e) {}
// Client, 2026-10-07: "no need for bid replys to be seperate on top of
// loads in the web, it should be just like a normal load with the
// loads" — replies render inline in the same time-sorted, paginated
// grid now (see the key/html branch above), not a separate section.
const feedKey = (it) => it.type === "reply" ? `reply|${it.id}` : `${it.order}|${it.received_at || ""}`;
function visibleLoads() {
  return allLoads.filter((it) => !clearedKeys.has(feedKey(it)));
}

const loadsControls = MB.mountListControls(document.getElementById("loads-controls"), {
  searchPlaceholder: "Search loads (order, route, broker)…",
  sortOptions: [
    { key: "received_at",  label: "Newest" },
    { key: "order",        label: "Order #" },
    { key: "pickup_loc",   label: "Pickup" },
    { key: "delivery_loc", label: "Delivery" },
    { key: "broker_name",  label: "Broker" },
  ],
  pageSize: 20,
  onChange: applyLoadsControls,
});
loadsControls.sortDir = "desc";
document.getElementById("loads-controls").querySelector(".list-sort-dir").textContent = "↓";

function applyLoadsControls() {
  const result = MB.filterSortPaginate(visibleLoads(), {
    searchTerm: loadsControls.searchTerm,
    searchFields: ["order", "pickup_loc", "delivery_loc", "broker_name", "broker_email"],
    sortKey: loadsControls.sortKey,
    sortDir: loadsControls.sortDir,
    page: loadsControls.page,
    pageSize: 20,
  });
  loadsControls.page = result.page;
  loadsControls._updatePager(result.page, result.totalPages);
  renderLoads(result.items);
}

// ── New-load alert — client, 2026-10-01: "when a new load comes in it
// should give notification just like when in facebook new message
// comes in". A real OS/browser notification popup + a short beep +
// (while the tab isn't focused) a flashing tab title, fired only for
// orders not already seen this session — the FIRST fetch just silently
// records every order already in the feed so opening the page doesn't
// "notify" about 50 loads that already existed.
const NOTIFY_KEY = "mailbot_notify_enabled";
let notifyEnabled = false;
try { notifyEnabled = localStorage.getItem(NOTIFY_KEY) === "1"; } catch (e) {}
let seenOrderIds = null; // null = first fetch hasn't happened yet
let titleFlashTimer = null;
const ORIGINAL_TITLE = document.title;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    osc.start();
    osc.stop(ctx.currentTime + 0.36);
    osc.onended = () => ctx.close();
  } catch (e) { /* audio not available — notification/flash still happen */ }
}

function flashTitle() {
  if (!document.hidden) return;
  let on = false;
  clearInterval(titleFlashTimer);
  titleFlashTimer = setInterval(() => {
    document.title = on ? ORIGINAL_TITLE : "🔴 New load! — PLUTUS BOT";
    on = !on;
  }, 1000);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    clearInterval(titleFlashTimer);
    document.title = ORIGINAL_TITLE;
  }
});

function notifyNewLoad(it) {
  if (!notifyEnabled) return;
  beep();
  flashTitle();
  if (window.Notification && Notification.permission === "granted") {
    try {
      const isReply = it.type === "reply";
      const title = isReply ? `💬 Broker reply — ${(it.labels || []).join(", ") || "reply"}` : `New load — #${it.order || "?"}`;
      const body = isReply
        ? (it.message || it.subject || "Open to view")
        : `${it.pickup_loc || "?"} → ${it.delivery_loc || "?"}${it.driver_name ? " · " + it.driver_name : ""}`;
      const n = new Notification(title, {
        body,
        tag: isReply ? `mailbot-reply-${it.id}` : `mailbot-load-${it.order}`,
      });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) { /* ignore — beep/flash already fired */ }
  }
}

const notifyBtn = document.getElementById("notify-toggle-btn");
function renderNotifyBtn() {
  notifyBtn.textContent = notifyEnabled ? "🔔 Alerts on" : "🔕 Enable alerts";
  notifyBtn.classList.toggle("btn-primary", notifyEnabled);
}
renderNotifyBtn();
notifyBtn.addEventListener("click", async () => {
  if (notifyEnabled) {
    notifyEnabled = false;
  } else {
    if (window.Notification && Notification.permission !== "granted" && Notification.permission !== "denied") {
      try { await Notification.requestPermission(); } catch (e) {}
    }
    notifyEnabled = true;
    beep(); // immediate feedback that alerts are now on
  }
  try { localStorage.setItem(NOTIFY_KEY, notifyEnabled ? "1" : "0"); } catch (e) {}
  renderNotifyBtn();
});

async function refresh() {
  try {
    const feed = await MB.apiGet("/api/web/feed", { limit: 50 });
    allLoads = feed.items;
    // type-prefixed — a reply and a load sharing the same order number
    // are different events and must not suppress each other's
    // notification. Replies have no order_id at all (2026-10-07
    // redesign — a Gmail thread/label, not a parsed load) so they key
    // on their own activity_log row id instead, which every reply
    // in a single fetch would otherwise collide on (same undefined
    // "order"), only ever notifying for the first one ever seen.
    const seenKey = (it) => it.type === "reply" ? `reply:${it.id}` : `load:${it.order}`;
    const currentIds = new Set(allLoads.map(seenKey));
    if (seenOrderIds === null) {
      seenOrderIds = currentIds; // first load — just establish the baseline
    } else {
      allLoads.forEach((it) => {
        if (!seenOrderIds.has(seenKey(it))) {
          seenOrderIds.add(seenKey(it));
          notifyNewLoad(it);
        }
      });
    }
    applyLoadsControls();
    MB.setConn(true);
  } catch (err) {
    MB.setConn(false);
    MB.bounceIfAuthError(err);
  }
}

const refreshBtn = document.getElementById("refresh-btn");
refreshBtn.addEventListener("click", async () => {
  refreshBtn.disabled = true;
  const original = refreshBtn.textContent;
  refreshBtn.textContent = "⟳ …";
  await refresh();
  refreshBtn.textContent = original;
  refreshBtn.disabled = false;
});

document.getElementById("clear-feed-btn").addEventListener("click", () => {
  allLoads.forEach((it) => clearedKeys.add(feedKey(it)));
  try { localStorage.setItem(CLEARED_KEY, JSON.stringify([...clearedKeys])); } catch (e) {}
  applyLoadsControls();
  showToast("Feed cleared");
});

document.getElementById("loads-list").innerHTML = MB.skeletonCards(4);

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
