<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plutus Bot — Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/plutus_logo.jpg">
</head>
<body>

<header id="app-nav" class="topbar"></header>

<main class="content">
  <section class="stats-row" aria-label="Summary stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total bids</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-winrate">—</div>
      <div class="stat-label">Win rate</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-rate">—</div>
      <div class="stat-label">Avg $/mile</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-pending">—</div>
      <div class="stat-label">Pending</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Live feed</h2>
      <span class="panel-hint"><a href="loads.html">See all &amp; take action →</a></span>
    </div>
    <div id="feed-list" class="feed-list"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Bid history</h2>
      <button id="export-csv-btn" class="btn btn-sm" type="button">⬇ Export CSV</button>
    </div>
    <div id="bid-history-controls"></div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Order</th><th>Lane</th><th>Vehicle</th><th>Rate</th><th>$/mi</th><th>Status</th><th>When</th></tr>
        </thead>
        <tbody id="bid-table-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="common.js"></script>
<script>
const MB = window.MailBot;
MB.requireAuth();
MB.initTheme();
MB.renderTopbar("index.html");

function renderStats(stats) {
  document.getElementById("stat-total").textContent = stats.total_bids ?? "—";
  document.getElementById("stat-winrate").textContent = MB.fmtPct(stats.win_rate);
  document.getElementById("stat-rate").textContent = MB.fmtRate(stats.avg_rate_per_mile);
  document.getElementById("stat-pending").textContent = stats.pending ?? "—";
}

function renderFeed(items) {
  const el = document.getElementById("feed-list");
  MB.diffRender(el, (items || []).slice(0, 8), {
    key: (it) => it.order,
    isRow: false,
    emptyHtml: '<p class="empty-note">No matched loads yet.</p>',
    html: (it) => {
      const decision = it.load_decision?.decision;
      const decisionBadge = decision
        ? `<span class="badge decision-${decision.toLowerCase()}">${MB.esc(decision)}</span>`
        : "";
      const miles = it.google_deadhead != null ? `${it.google_deadhead}mi deadhead` : "";
      const meta = [it.driver_name, miles].filter(Boolean).map(MB.esc).join(" · ");
      return `
        <div class="feed-card">
          <div class="order">#${MB.esc(it.order)} <span style="color:var(--text-dim);font-weight:400;">${MB.esc(it.vehicle_required || "")}</span></div>
          ${decisionBadge}
          <div class="route">${MB.esc(it.pickup_loc || "?")} → ${MB.esc(it.delivery_loc || "?")}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ""}
        </div>`;
    },
  });
}

function renderBidHistory(items) {
  const el = document.getElementById("bid-table-body");
  MB.diffRender(el, items, {
    key: (b) => b.id,
    isRow: true,
    emptyHtml: '<tr><td colspan="7" class="empty-note">No bids yet.</td></tr>',
    html: (b) => {
      const status = (b.status || "pending").toLowerCase();
      return `
        <tr>
          <td>#${MB.esc(b.order_id)}</td>
          <td>${MB.esc(b.lane || "—")}</td>
          <td>${MB.esc(b.vehicle_type || "—")}</td>
          <td>${MB.fmtMoney(b.bid_amount)}</td>
          <td>${MB.fmtRate(b.rate_per_mile)}</td>
          <td><span class="status-pill status-${status}">${MB.esc(b.status || "pending")}</span></td>
          <td>${MB.fmtWhen(b.created_at)}</td>
        </tr>`;
    },
  });
}

let allBidHistory = [];
const bidHistoryControls = MB.mountListControls(document.getElementById("bid-history-controls"), {
  searchPlaceholder: "Search bid history (order, lane, vehicle)…",
  sortOptions: [
    { key: "created_at", label: "Date" },
    { key: "order_id", label: "Order #" },
    { key: "bid_amount", label: "Rate" },
    { key: "rate_per_mile", label: "$/mi" },
  ],
  onChange: applyBidHistoryControls,
});
// Default to newest-first (matches the server's own ORDER BY), not
// mountListControls' generic ascending default.
bidHistoryControls.sortDir = "desc";
document.getElementById("bid-history-controls").querySelector(".list-sort-dir").textContent = "↓";

function applyBidHistoryControls() {
  const result = MB.filterSortPaginate(allBidHistory, {
    searchTerm: bidHistoryControls.searchTerm,
    searchFields: ["order_id", "lane", "vehicle_type", "broker_email"],
    sortKey: bidHistoryControls.sortKey,
    sortDir: bidHistoryControls.sortDir,
  });
  renderBidHistory(result.items);
}

document.getElementById("export-csv-btn").addEventListener("click", async () => {
  const btn = document.getElementById("export-csv-btn");
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const res = await MB.apiGet("/api/web/bid_history", { limit: 5000 });
    MB.exportCsv(`bid_history_${new Date().toISOString().slice(0, 10)}.csv`, res.items, [
      { key: "order_id", label: "Order" },
      { key: "lane", label: "Lane" },
      { key: "pickup_loc", label: "Pickup" },
      { key: "delivery_loc", label: "Delivery" },
      { key: "vehicle_type", label: "Vehicle" },
      { key: "broker_name", label: "Broker name" },
      { key: "broker_email", label: "Broker email" },
      { key: "bid_amount", label: "Rate" },
      { key: "rate_per_mile", label: "$/mi" },
      { key: "status", label: "Status" },
      { key: "bid_method", label: "Method" },
      { key: "created_at", label: "Created" },
      { key: "outcome_at", label: "Outcome date" },
    ]);
  } catch (err) {
    showToastFallback(err.message || "Export failed");
  } finally {
    btn.disabled = false;
    btn.textContent = "⬇ Export CSV";
  }
});
// index.html has no #toast element today — a plain alert is an
// acceptable fallback for this one rare error path rather than adding
// a whole toast element just for it.
function showToastFallback(msg) { alert(msg); }

async function refreshAll() {
  try {
    const [stats, feed, hist] = await Promise.all([
      MB.apiGet("/api/web/stats"),
      MB.apiGet("/api/web/feed", { limit: 30 }),
      MB.apiGet("/api/web/bid_history", { limit: 15 }),
    ]);
    renderStats(stats);
    renderFeed(feed.items);
    allBidHistory = hist.items;
    applyBidHistoryControls();
    MB.setConn(true);
  } catch (err) {
    MB.setConn(false);
    MB.bounceIfAuthError(err);
  }
}

document.getElementById("feed-list").innerHTML = MB.skeletonCards(3);
document.getElementById("bid-table-body").innerHTML = MB.skeletonRows(7, 5);

refreshAll();
setInterval(refreshAll, 10000);
</script>
</body>
</html>
